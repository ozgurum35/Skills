# Kaynak repoda yeni sürüm çıktıysa issue açar. Kod kopyalamaz, dosya değiştirmez.
name: Kaynak sürüm kontrolü

on:
  schedule:
    - cron: "17 6 * * 1" # Her pazartesi 06:17 UTC (09:17 TR)
  workflow_dispatch:
    inputs:
      simulate_version:
        description: "Yalnızca test için: kaynak sürüm yerine bu değeri kullan (boş bırak)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sürümleri karşılaştır ve gerekirse issue aç
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_VERSION: ${{ inputs.simulate_version }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO=$(jq -r .repo UPSTREAM.json)
          VERSION_FILE=$(jq -r .version_file UPSTREAM.json)
          LOCAL_VERSION=$(jq -r .version UPSTREAM.json)

          if [ -n "${SIMULATE_VERSION}" ]; then
            REMOTE_VERSION="${SIMULATE_VERSION}"
            echo "TEST MODU: kaynak sürüm ${REMOTE_VERSION} olarak varsayılıyor"
          else
            REMOTE_VERSION=$(gh api "repos/${UPSTREAM_REPO}/contents/${VERSION_FILE}" \
              -H "Accept: application/vnd.github.raw" | jq -r .version)
          fi

          # Dışarıdan gelen değeri doğrula (yalnızca sürüm biçimi kabul edilir)
          if ! [[ "${REMOTE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Kaynak sürüm beklenen biçimde değil: '${REMOTE_VERSION}'"
            exit 1
          fi

          echo "Kurulu: ${LOCAL_VERSION} | Kaynak: ${REMOTE_VERSION}"
          if [ "${REMOTE_VERSION}" = "${LOCAL_VERSION}" ]; then
            echo "Güncel. Yapılacak bir şey yok."
            exit 0
          fi

          TITLE="Kaynak güncellendi: ${UPSTREAM_REPO} ${REMOTE_VERSION}"
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json title \
            --jq "map(select(.title == \"${TITLE}\")) | length")
          if [ "${EXISTING}" != "0" ]; then
            echo "Bu sürüm için açık issue zaten var."
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "Kaynak repoda yeni sürüm var." \
            "" \
            "- Kaynak: https://github.com/${UPSTREAM_REPO}" \
            "- Kurulu sürüm: \`${LOCAL_VERSION}\`" \
            "- Yeni sürüm: \`${REMOTE_VERSION}\`" \
            "- Değişiklikler: https://github.com/${UPSTREAM_REPO}/releases" \
            "" \
            "Güncellemek için Claude Code'a: **skill'leri güncelle** (inceleme + test + gönderim)." )
          gh issue create --title "${TITLE}" --body "${BODY}"
          echo "Issue açıldı."
