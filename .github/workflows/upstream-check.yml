# Kaynak repolarda yeni sürüm/commit varsa issue açar. Kod kopyalamaz, dosya değiştirmez.
# Kaynak listesi: UPSTREAM.json
#   track: "version" -> version_file içindeki .version alanı karşılaştırılır
#   track: "commit"  -> path klasörüne gelen son commit karşılaştırılır
name: Kaynak sürüm kontrolü

on:
  schedule:
    - cron: "17 6 * * 1" # Her pazartesi 06:17 UTC (09:17 TR)
  workflow_dispatch:
    inputs:
      simulate:
        description: "Yalnızca test için: her kaynakta değişiklik varmış gibi davran"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Kaynakları karşılaştır ve gerekirse issue aç
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate }}
        run: |
          set -euo pipefail
          FAILED=0
          COUNT=$(jq '.sources | length' UPSTREAM.json)

          for i in $(seq 0 $((COUNT - 1))); do
            SRC=$(jq -c ".sources[$i]" UPSTREAM.json)
            REPO=$(jq -r .repo <<<"$SRC")
            TRACK=$(jq -r .track <<<"$SRC")
            SKILLS=$(jq -r '.skills | join(", ")' <<<"$SRC")
            echo "::group::${REPO} (${TRACK})"

            if [ "$TRACK" = "version" ]; then
              LOCAL=$(jq -r .version <<<"$SRC")
              if [ "${SIMULATE}" = "true" ]; then
                REMOTE="9.9.9-test"
              else
                REMOTE=$(gh api "repos/${REPO}/contents/$(jq -r .version_file <<<"$SRC")" \
                  -H "Accept: application/vnd.github.raw" | jq -r .version) || REMOTE=""
              fi
              PATTERN='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
              LINK="https://github.com/${REPO}/releases"
            elif [ "$TRACK" = "commit" ]; then
              LOCAL=$(jq -r .commit <<<"$SRC")
              SRC_PATH=$(jq -r .path <<<"$SRC")
              if [ "${SIMULATE}" = "true" ]; then
                REMOTE="0000000000000000000000000000000000000000"
              else
                REMOTE=$(gh api "repos/${REPO}/commits?path=${SRC_PATH}&per_page=1" --jq '.[0].sha') || REMOTE=""
              fi
              PATTERN='^[0-9a-f]{40}$'
              LINK="https://github.com/${REPO}/compare/${LOCAL}...${REMOTE}"
            else
              echo "::error::${REPO}: bilinmeyen track değeri '${TRACK}'"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # Dışarıdan gelen değeri doğrula
            if ! [[ "${REMOTE}" =~ $PATTERN ]]; then
              echo "::error::${REPO}: kaynak değer okunamadı veya beklenen biçimde değil: '${REMOTE}'"
              FAILED=1; echo "::endgroup::"; continue
            fi

            echo "Kurulu: ${LOCAL} | Kaynak: ${REMOTE}"
            if [ "${REMOTE}" = "${LOCAL}" ]; then
              echo "Güncel."; echo "::endgroup::"; continue
            fi

            TITLE="Kaynak güncellendi: ${REPO} ${REMOTE:0:12}"
            EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json title \
              --jq "map(select(.title == \"${TITLE}\")) | length")
            if [ "${EXISTING}" != "0" ]; then
              echo "Bu değişiklik için açık issue zaten var."; echo "::endgroup::"; continue
            fi

            BODY=$(printf '%s\n' \
              "Kaynak repoda değişiklik var." \
              "" \
              "- Kaynak: https://github.com/${REPO}" \
              "- Etkilenen skill'ler: ${SKILLS}" \
              "- Takip: \`${TRACK}\`" \
              "- Kurulu: \`${LOCAL}\`" \
              "- Yeni: \`${REMOTE}\`" \
              "- Değişiklikler: ${LINK}" \
              "" \
              "Güncellemek için Claude Code'a: **skill'leri güncelle** (inceleme + test + gönderim)." )
            gh issue create --title "${TITLE}" --body "${BODY}"
            echo "Issue açıldı."
            echo "::endgroup::"
          done

          exit $FAILED
